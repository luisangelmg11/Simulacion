<!DOCTYPE html>
<html lang="es_MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método de Productos Medios</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }

        h1 {
            color: #0d6efd;
            margin-bottom: 20px;
        }

        .form-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .table {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center">Método de Productos Medios</h1>

        <!-- Formulario -->
        <div class="form-container">
            <form id="productosMediosForm">
                <div class="mb-3">
                    <label for="semilla1" class="form-label">Semilla 1 (X0):</label>
                    <input type="number" class="form-control" id="semilla1" name="semilla1" required>
                </div>
                <div class="mb-3">
                    <label for="semilla2" class="form-label">Semilla 2 (X1):</label>
                    <input type="number" class="form-control" id="semilla2" name="semilla2" required>
                </div>
                <div class="mb-3">
                    <label for="iteraciones" class="form-label">Número de iteraciones:</label>
                    <input type="number" class="form-control" id="iteraciones" name="iteraciones" required>
                </div>
                <button type="button" class="btn btn-primary w-100"
                    onclick="calcularProductosMedios()">Calcular</button>
            </form>
        </div>

        <!-- Tabla de resultados -->
        <h2 class="text-center">Resultados</h2>
        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Iteración</th>
                        <th>X<sub>i</sub></th>
                        <th>X<sub>i+1</sub></th>
                        <th>X<sub>i</sub> * X<sub>i+1</sub></th>
                        <th>Número Pseudoaleatorio</th>
                    </tr>
                </thead>
                <tbody id="resultados">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS y dependencias -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <!-- Script del método de productos medios -->
    <script>
        function calcularProductosMedios() {
            // Obtener las semillas y el número de iteraciones
            const semilla1 = document.getElementById('semilla1').value;
            const semilla2 = document.getElementById('semilla2').value;
            const iteraciones = parseInt(document.getElementById('iteraciones').value);
            const resultadosTbody = document.querySelector('#resultados');
            resultadosTbody.innerHTML = '';

            // Convertir las semillas a números
            let Xi = parseInt(semilla1);
            let Xi1 = parseInt(semilla2);
            const digitos = semilla1.length; // Asumimos que ambas semillas tienen la misma longitud

            // Iterar para generar los números pseudoaleatorios
            for (let i = 1; i <= iteraciones; i++) {
                // Calcular el producto de Xi y Xi+1
                const producto = Xi * Xi1;
                let productoStr = producto.toString();

                // Si el número de dígitos es impar, agregar un cero a la izquierda
                if (productoStr.length % 2 !== 0) {
                    productoStr = '0' + productoStr;
                }

                // Seleccionar los dígitos del centro
                const inicio = Math.floor((productoStr.length - digitos) / 2);
                const fin = inicio + digitos;
                const nuevoXi1Str = productoStr.substring(inicio, fin);
                const nuevoXi1 = parseInt(nuevoXi1Str);

                // Calcular el número pseudoaleatorio
                const numeroPseudoaleatorio = parseFloat('0.' + nuevoXi1Str);

                // Mostrar los resultados en la tabla
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i}</td>
                    <td>${Xi}</td>
                    <td>${Xi1}</td>
                    <td>${productoStr}</td>
                    <td>${numeroPseudoaleatorio}</td>
                `;
                resultadosTbody.appendChild(row);

                // Actualizar Xi y Xi+1 para la siguiente iteración
                Xi = Xi1;
                Xi1 = nuevoXi1;
            }
        }
    </script>
</body>

</html>
