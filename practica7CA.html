<!DOCTYPE html>
<html lang="es_MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congruencial Aditivo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #bbc3ee;
            padding: 20px;
        }

        h1 {
            color: #000000;
            margin-bottom: 20px;
        }

        .form-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .table {
            margin-top: 20px;
        }

        .alert {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center">Congruencial Aditivo</h1>

        <!-- Formulario -->
        <div class="form-container">
            <form id="aditivoForm">
                <div class="mb-3">
                    <label for="semillas" class="form-label">Semillas (separadas por comas):</label>
                    <input type="text" class="form-control" id="semillas" name="semillas" required>
                </div>
                <div class="mb-3">
                    <label for="modulo" class="form-label">Módulo (m):</label>
                    <input type="number" class="form-control" id="modulo" name="modulo" required>
                </div>
                <div class="mb-3">
                    <label for="iteraciones" class="form-label">Número de iteraciones:</label>
                    <input type="number" class="form-control" id="iteraciones" name="iteraciones" required>
                </div>
                <button type="button" class="btn btn-primary w-100" onclick="calcularAditivo()">Calcular</button>
            </form>
        </div>

        <!-- Mensaje de advertencia -->
        <div id="advertencia" class="alert alert-warning d-none" role="alert">
            Las semillas y el módulo deben ser números mayores a 0.
        </div>

        <!-- Tabla de resultados -->
        <h2 class="text-center">Resultados</h2>
        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Iteración</th>
                        <th>X<sub>i</sub></th>
                        <th>División</th>
                        <th>Número Pseudoaleatorio</th>
                    </tr>
                </thead>
                <tbody id="resultados">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <!-- Script del algoritmo congruencial aditivo -->
    <script>
        function calcularAditivo() {
            // Obtener los valores del formulario
            const semillasInput = document.getElementById('semillas').value;
            const modulo = parseInt(document.getElementById('modulo').value);
            const iteraciones = parseInt(document.getElementById('iteraciones').value);
            const resultadosTbody = document.querySelector('#resultados');
            const advertencia = document.getElementById('advertencia');

            // Convertir las semillas a un array de números
            const semillas = semillasInput.split(',').map(Number);

            // Validar que las semillas y el módulo sean mayores a 0
            if (semillas.some(s => s <= 0) || modulo <= 0) {
                advertencia.classList.remove('d-none'); // Mostrar advertencia
                resultadosTbody.innerHTML = ''; // Limpiar tabla de resultados
                return; // Detener la ejecución
            } else {
                advertencia.classList.add('d-none'); // Ocultar advertencia si los valores son válidos
            }

            // Limpiar la tabla de resultados
            resultadosTbody.innerHTML = '';

            // Inicializar la secuencia con las semillas
            let secuencia = [...semillas];

            // Iterar para generar los números pseudoaleatorios
            for (let i = 0; i < iteraciones; i++) {
                // Calcular el siguiente valor de X usando la fórmula del algoritmo congruencial aditivo
                const Xi = (secuencia[secuencia.length - 1] + secuencia[secuencia.length - semillas.length]) % modulo;

                // Agregar el nuevo valor a la secuencia
                secuencia.push(Xi);

                // Calcular la división (X_i / (m - 1)) para normalizar el número pseudoaleatorio entre 0 y 1
                const division = Xi / (modulo - 1);

                // Mostrar los resultados en la tabla
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i + 1}</td> <!-- Columna de la iteración -->
                    <td>${Xi}</td> <!-- Columna del valor actual de X_i -->
                    <td>${division.toFixed(4)}</td> <!-- Columna de la división (X_i / (m - 1)) -->
                    <td>${division.toFixed(4)}</td> <!-- Columna del número pseudoaleatorio normalizado -->
                `;
                resultadosTbody.appendChild(row); // Agregar la fila a la tabla
            }
        }
    </script>
</body>

</html>
